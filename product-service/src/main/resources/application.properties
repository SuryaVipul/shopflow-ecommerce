# Application Identity & Port
spring.application.name=product-service
server.port=8083

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# MySQL DataSource (product_db)
# Note: Change 3306 to 3307 if you moved Docker MySQL to 3307 earlier
spring.datasource.url=jdbc:mysql://localhost:3307/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=shopflow
spring.datasource.password=shopflow123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis Connection (matches docker-compose.yml)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Eureka Client Registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator Health (shows both MySQL and Redis status)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always