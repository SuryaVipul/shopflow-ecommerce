# Application identity & standard Eureka port
spring.application.name=service-registry
server.port=8761

# Hostname used to construct the Eureka server URL
eureka.instance.hostname=localhost

# Standalone mode: Do NOT register Eureka Server with itself or fetch a registry from peers
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka/

# Disable self-preservation ONLY in local dev so crashed services are evicted quickly
eureka.server.enable-self-preservation=false

# Expose Actuator health endpoint
management.endpoints.web.exposure.include=health,info