# Application Identity & Port
spring.application.name=user-service
server.port=8082

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# MySQL DataSource (matches docker/mysql/init-databases.sql)
spring.datasource.url=jdbc:mysql://localhost:3307/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=shopflow
spring.datasource.password=shopflow123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
# 'validate' ensures Hibernate checks entities against Flyway tables without altering schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Eureka Client Registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Actuator Health (shows DB connectivity status)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always