# Application Identity & Public Entry Port
spring.application.name=api-gateway
server.port=8081

# Enable Java 21 Virtual Threads for high concurrency on Spring MVC
spring.threads.virtual.enabled=true

# Register with Eureka and fetch the live service directory
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Route 1: Forward /api/auth/** and /api/users/** to user-service (via Eureka LoadBalancer)
spring.cloud.gateway.server.webmvc.routes[0].id=user-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

# Route 2: Forward product & category endpoints to product-service
spring.cloud.gateway.server.webmvc.routes[1].id=product-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/products/**,/api/categories/**,/api/admin/products/**,/api/admin/categories/**

# Expose Actuator health & info endpoints
management.endpoints.web.exposure.include=health,info

